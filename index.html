<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b7a43">
<meta name="apple-mobile-web-app-title" content="קבוצות">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>חלוקת קבוצות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f3f6f1;--card:#fff;--ink:#122219;--mute:#617066;--line:#e0e7df;--soft:#edf2ec;
  --pitch:#1b7a43;--pitch-d:#135c32;
  --red:#e0413a;--blue:#2d6be0;--yellow:#f2b705;
  --r:16px;--nav:64px;--safe:env(safe-area-inset-bottom,0px);
  --fd:'Karantina','Assistant',system-ui,sans-serif;
  --fb:'Assistant',-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:400 17px/1.3 var(--fb);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--pitch)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{background:var(--pitch);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 18px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--yellow) 0 33.34%,var(--blue) 33.34% 66.67%,var(--red) 66.67%)}
.top-in{max-width:560px;margin:0 auto}
.top h1{font:700 40px/.95 var(--fd);margin:0;letter-spacing:.3px}
.top p{margin:6px 0 0;font-size:15px;color:#d6eadc}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(var(--nav) + var(--safe) + 104px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{font-size:19px;line-height:1.2;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:15px;margin:-6px 0 12px}
.num{font:700 30px/1 var(--fd)}
.num small{font:600 15px var(--fb);color:var(--mute);margin-right:2px}
.meter{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:-2px 0 14px}
.meter i{display:block;height:100%;background:var(--pitch);border-radius:6px;transition:width .25s}
.meter.full i{background:var(--yellow)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.chip.on .x{font-size:19px;line-height:1;opacity:.75}
.chip[aria-disabled=true]{opacity:.45}
.scroll{max-height:340px;overflow-y:auto;margin:0 -4px;padding:2px 4px}
.empty{color:var(--mute);font-size:15px;margin:0}
.link{background:none;border:0;padding:6px 0;color:var(--pitch);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.note{background:#fff7d6;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--pitch);color:#fff;font-weight:700;font-size:17px;text-decoration:none;text-align:center}
.btn small{font-weight:400;font-size:14px;opacity:.85}
.btn:disabled{background:#b8c5bb;color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1fae52}
.row2 .btn{white-space:nowrap;padding:0 12px}
.btn svg{width:20px;height:20px;flex:none}
.row2{display:flex;gap:8px}
.row2>*{flex:1}

/* bottom dock + nav */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe));padding:14px 16px 10px;background:linear-gradient(to bottom,rgba(243,246,241,0),var(--bg) 35%);z-index:5}
.dock-in{max-width:528px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--mute)}
nav.tabs button[aria-current=page]{color:var(--pitch)}
nav.tabs svg{width:26px;height:26px}

/* teams */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0 12px;color:var(--pitch);font-weight:700;font-size:16px}
.back svg{width:18px;height:18px}
.sum-line{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute);margin:0 0 12px}
.sum-line b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pitch);flex:none}
.hint{background:#fff7d6;border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 12px}
.team{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.team-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border:0;background:var(--tc);color:var(--tk);text-align:right}
.tn{font:700 36px/.9 var(--fd)}
.ts{display:flex;flex-direction:column;align-items:center;line-height:1}
.ts b{font:700 38px/.9 var(--fd)}
.ts small{font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.team.target .team-h{box-shadow:inset 0 0 0 3px var(--ink)}
.team.target .team-h::after{content:"העבר לכאן";font-size:13px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;margin-inline-start:auto}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px 6px;font-size:14px;color:var(--mute)}
.pill{background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pr{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:right;font-size:17px}
.pr:first-child{border-top:0}
.pr .n{flex:1;font-weight:600}
.pr.sel{background:#fff1b0}
.pos{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-weight:600}
.rt{font:700 24px/1 var(--fd);min-width:36px;text-align:center}
.warn{color:#b3261e;font-size:15px;margin:0 0 12px}

/* players */
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;white-space:nowrap;padding:0 10px}
.seg button[aria-pressed=true]{background:#fff;color:var(--pitch);box-shadow:0 1px 2px rgba(18,34,25,.14)}
.tools .seg{flex:none}
.list{margin:0 -16px -16px}
.list .pr{padding:8px 16px}
.chev{color:#b2bdb5;font-size:20px;line-height:1}
.rule{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule .t{flex:1}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.t{background:#e3f2e8;color:var(--pitch-d)}
.tag.n{background:#fde8e6;color:#a8231c}
.icon-x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mute);font-size:18px;flex:none}

/* sheet */
#ov{position:fixed;inset:0;z-index:20;background:rgba(18,34,25,.45);display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
#ov.open{opacity:1}
.sheet{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safe));max-height:92vh;overflow-y:auto;transform:translateY(30px);transition:transform .22s}
#ov.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:#d5ddd6;margin:0 auto 6px}
.sheet h3{font:700 34px/1 var(--fd);margin:6px 0 16px}
.fl{display:block;font-size:15px;font-weight:600;color:var(--mute);margin-bottom:16px}
.fl>input,.fl>.seg,.fl>.pk,.fl>.wheel{margin-top:6px}
.err{color:#b3261e;font-size:15px;margin:-4px 0 12px}
.danger{display:block;margin:12px auto 0;background:none;border:0;color:#b3261e;font-weight:700;font-size:16px;padding:10px 14px;border-radius:10px}
.danger.armed{background:#fde8e6}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug:empty{display:none}
.picked{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;background:var(--soft);border-radius:12px;padding:6px 6px 6px 14px;color:var(--ink);font-size:17px;font-weight:700}
.picked button{border:0;background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--mute)}
.wheel{position:relative;height:220px;background:var(--soft);border-radius:14px;overflow:hidden}
.wl{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;text-align:center;scrollbar-width:none}
.wl::-webkit-scrollbar{display:none}
.wl div{height:44px;line-height:44px;scroll-snap-align:center;font:700 26px/44px var(--fd);color:#a3b0a7}
.wl div.on{color:var(--ink);font-size:36px}
.band{position:absolute;left:12px;right:12px;top:88px;height:44px;border-radius:10px;background:rgba(255,255,255,.7);pointer-events:none;mix-blend-mode:multiply;border:1.5px solid var(--pitch)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 90px);transform:translate(-50%,12px);max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 id="title">משחק היום</h1><p id="subtitle"></p></div></header>

<main>
  <!-- game: choose who's coming -->
  <section id="v-select">
    <div class="card">
      <div class="ch"><h2>מגיעים היום</h2><span class="num" id="cnt">0<small>/21</small></span></div>
      <div class="meter" id="meter"><i id="bar" style="width:0"></i></div>
      <div class="chips" id="on"></div>
      <div class="row2" style="margin-top:12px">
        <button class="link" id="clear" style="flex:none">נקה את הבחירה</button>
        <button class="link" id="showLast" style="flex:none;margin-inline-start:auto">הקבוצות האחרונות</button>
      </div>
    </div>
    <div class="card">
      <div class="ch"><h2>כל השחקנים</h2><span class="sub" id="poolCnt" style="margin:0"></span></div>
      <input id="q" type="search" placeholder="חיפוש לפי שם" autocomplete="off" style="margin-bottom:12px">
      <p class="note" id="full" hidden>בחרת 21 שחקנים. כדי להוסיף מישהו, הסר קודם שחקן מלמעלה.</p>
      <div class="scroll"><div class="chips" id="pool"></div></div>
    </div>
  </section>

  <!-- game: teams -->
  <section id="v-teams" hidden>
    <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>שינוי המשתתפים</button>
    <p class="sum-line"><span class="dot"></span><span id="diff"></span></p>
    <p class="hint" id="hint" hidden></p>
    <div id="teams"></div>
    <div id="viol"></div>
    <button class="btn ghost" id="copy">העתק את הקבוצות כטקסט</button>
    <p class="sub" style="margin:12px 0 0;text-align:center">טיפ: לחץ על שחקן ואז על שחקן בקבוצה אחרת כדי להחליף ביניהם.</p>
  </section>

  <!-- players -->
  <section id="v-players" hidden>
    <div class="card">
      <div class="ch"><h2 id="pc">רשימת השחקנים</h2></div>
      <div class="tools">
        <input id="pq" type="search" placeholder="חיפוש" autocomplete="off">
        <div class="seg" id="sort" role="group" aria-label="מיון"><button data-v="n" aria-pressed="true">א-ב</button><button data-v="r" aria-pressed="false">דירוג</button></div>
      </div>
      <div class="list" id="plist"></div>
    </div>
    <div class="card">
      <div class="ch"><h2>זוגות</h2><button class="link" id="addRule">+ כלל חדש</button></div>
      <p class="sub">שחקנים שתמיד יהיו באותה קבוצה, או אף פעם לא.</p>
      <div id="rules"></div>
    </div>
    <div class="card">
      <div class="ch"><h2>גיבוי והעברה</h2></div>
      <p class="sub">שמור עותק של הרשימה, או העבר אותה לטלפון אחר.</p>
      <div class="row2"><button class="btn ghost" id="bk">העתק גיבוי</button><button class="btn ghost" id="rs">שחזר מגיבוי</button></div>
    </div>
  </section>
</main>

<div class="dock" id="dock"><div class="dock-in" id="dockIn"></div></div>

<nav class="tabs">
  <button data-tab="game" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7l-1.5-4.4z"/><path d="M12 7.5V3.2M15.8 10.3l4-1.4M14.3 14.7l2.6 3.6M9.7 14.7l-2.6 3.6M8.2 10.3l-4-1.4"/></svg>משחק</button>
  <button data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.3.1 4 1.7 4.5 4.3"/></svg>שחקנים</button>
</nav>

<div id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='football-teams-v2',MAXP=21;
const POS={d:'הגנה',m:'אמצע',a:'התקפה'};
const COL=[{n:'אדומים',e:'🔴',c:'--red',k:'#fff'},{n:'כחולים',e:'🔵',c:'--blue',k:'#fff'},{n:'צהובים',e:'🟡',c:'--yellow',k:'#122219'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate=v=>{v=parseFloat(String(v).replace(',','.'));if(isNaN(v))v=3;return Math.min(5,Math.max(1,Math.round(v*10)/10))};
const pos=v=>POS[v]?v:'';
const byName=(a,b)=>a.n.localeCompare(b.n,'he');

/* ---------- state ---------- */
let S={players:[],rules:[],present:[],teams:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.players))S=x}catch(e){}
S.players=(S.players||[]).filter(p=>p&&p.n!=null).map(p=>({id:+p.id,n:String(p.n),r:rate(p.r),pos:pos(p.pos)}));
const has=id=>S.players.some(p=>p.id===id);
S.rules=(S.rules||[]).filter(r=>has(r.a)&&has(r.b));
S.present=(S.present||[]).filter(has).slice(0,MAXP);
S.teams=Array.isArray(S.teams)?S.teams.map(t=>t.filter(has)):null;
if(S.teams&&!S.teams.some(t=>t.length))S.teams=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=id=>S.players.find(p=>p.id===id);
let tab='game',mode=S.teams?'teams':'select',sel=null,sortBy='n',last=S.teams?key(S.teams):'';

function key(t){return t.map(x=>x.slice().sort().join()).sort().join('|')}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tot=t=>t.reduce((s,id)=>s+P(id).r,0);

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}

/* ---------- navigation ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sel=null;render();scrollTo(0,0)});
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const g=tab==='game';
  $('v-select').hidden=!(g&&mode==='select');$('v-teams').hidden=!(g&&mode==='teams');$('v-players').hidden=g;
  $('title').textContent=g?(mode==='teams'?'הקבוצות':'משחק היום'):'השחקנים שלי';
  $('subtitle').textContent=g?(mode==='teams'?'החלוקה מאוזנת לפי סכום הדירוגים':'סמן מי הגיע, ואז חלק לקבוצות'):'דירוגים, עמדות וזוגות';
  if(g&&mode==='select')renderSelect();
  if(g&&mode==='teams')renderTeams();
  if(!g)renderPlayers();
  renderDock();
}

/* ---------- select view ---------- */
function renderSelect(){
  const pr=S.present,n=pr.length,full=n>=MAXP;
  $('cnt').innerHTML=`${n}<small>/${MAXP}</small>`;
  $('bar').style.width=(n/MAXP*100)+'%';$('meter').classList.toggle('full',full);
  const on=S.players.filter(p=>pr.includes(p.id)).sort(byName);
  $('on').innerHTML=on.length?on.map(p=>`<button class="chip on" data-id="${p.id}" aria-label="הסר את ${esc(p.n)}">${esc(p.n)}<span class="x" aria-hidden="true">×</span></button>`).join('')
    :`<p class="empty">${S.players.length?'לחץ על שמות מהרשימה למטה כדי לסמן מי מגיע.':'קודם צריך להוסיף שחקנים.'}</p>`;
  const q=$('q').value.trim();
  const off=S.players.filter(p=>!pr.includes(p.id)&&(!q||p.n.includes(q))).sort(byName);
  $('poolCnt').textContent=S.players.length?`${S.players.length-n} לא מסומנים`:'';
  $('pool').innerHTML=!S.players.length?`<div><p class="empty">הרשימה ריקה.</p><button class="link" data-go="players">להוספת שחקנים</button></div>`
    :off.length?off.map(p=>`<button class="chip" data-id="${p.id}"${full?' aria-disabled="true"':''}>${esc(p.n)}</button>`).join('')
    :`<p class="empty">${q?'אין שחקן בשם הזה.':'כל השחקנים מסומנים.'}</p>`;
  $('full').hidden=!full;$('clear').hidden=!n;$('showLast').hidden=!S.teams;
}
$('on').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;S.present=S.present.filter(x=>x!==+b.dataset.id);save();renderSelect();renderDock()};
$('pool').onclick=e=>{
  const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();return}
  const b=e.target.closest('[data-id]');if(!b)return;
  if(S.present.length>=MAXP){toast('אפשר לבחור עד 21 שחקנים');return}
  S.present.push(+b.dataset.id);save();renderSelect();renderDock();
};
$('q').oninput=renderSelect;
$('clear').onclick=()=>{S.present=[];save();renderSelect();renderDock();toast('הבחירה נוקתה')};
$('showLast').onclick=()=>{mode='teams';render();scrollTo(0,0)};

/* ---------- split ---------- */
function split(){
  const ids=S.present.filter(has),n=ids.length;
  if(n<4){toast('סמן לפחות 4 שחקנים');return}
  const k=n>14?3:2,base=Math.floor(n/k),ex=n%k,R={},PS={},tm={};
  ids.forEach(id=>{R[id]=Math.round(P(id).r*10);PS[id]=P(id).pos});
  const score=t=>{
    t.forEach((x,i)=>x.forEach(id=>tm[id]=i));
    let v=0;for(const r of S.rules){const a=tm[r.a],b=tm[r.b];if(ids.includes(r.a)&&ids.includes(r.b)&&(r.k==='t'?a!==b:a===b))v++}
    const su=t.map(x=>x.reduce((s,id)=>s+R[id],0)),d=Math.max(...su)-Math.min(...su);
    let ps=0;for(const q of ['d','m','a']){const c=t.map(x=>x.filter(id=>PS[id]===q).length);ps+=Math.max(...c)-Math.min(...c)}
    return v*1e6+d*100+ps};
  const found=new Map();
  for(let rs=0;rs<80;rs++){
    const o=shuf(ids.slice()),sz=shuf(Array.from({length:k},(_,j)=>base+(j<ex?1:0))),t=[];let p=0;
    for(const s of sz){t.push(o.slice(p,p+s));p+=s}
    let cur=score(t);
    for(let it=0;it<1500;it++){
      const a=Math.floor(Math.random()*k);let b=Math.floor(Math.random()*(k-1));if(b>=a)b++;
      const i=Math.floor(Math.random()*t[a].length),j=Math.floor(Math.random()*t[b].length);
      [t[a][i],t[b][j]]=[t[b][j],t[a][i]];
      const sc=score(t);if(sc<=cur)cur=sc;else [t[a][i],t[b][j]]=[t[b][j],t[a][i]];
    }
    const q=key(t);if(!found.has(q))found.set(q,{t:t.map(x=>x.slice()),s:cur});
  }
  const all=[...found.values()].sort((a,b)=>a.s-b.s);
  if(all[0].s>=1e6){toast('אי אפשר לעמוד בכל הזוגות. נסה לבטל כלל.');return}
  let pool=[];for(const L of [...new Set(all.map(c=>c.s))]){pool=all.filter(c=>c.s===L&&key(c.t)!==last);if(pool.length)break}
  const c=pool.length?pool[Math.floor(Math.random()*pool.length)]:all[0];
  last=key(c.t);S.teams=c.t;sel=null;save();
  const was=mode;mode='teams';render();if(was!=='teams')scrollTo(0,0);
}

/* ---------- teams view ---------- */
const shareText=()=>'⚽ הקבוצות להיום\n\n'+S.teams.map((t,i)=>COL[i].e+' '+COL[i].n+'\n'+t.map(id=>'• '+P(id).n).join('\n')+'\nציון כולל: '+tot(t).toFixed(1)).join('\n\n');
function renderTeams(){
  if(!S.teams){mode='select';render();return}
  const sums=S.teams.map(tot),d=Math.max(...sums)-Math.min(...sums);
  $('diff').innerHTML=d<0.05?'<b>מאוזן בדיוק</b>: לכל הקבוצות אותו סכום':`הפרש בין הקבוצות: <b>${d.toFixed(1)}</b>`;
  const from=sel==null?-1:S.teams.findIndex(t=>t.includes(sel));
  $('hint').hidden=sel==null;
  if(sel!=null)$('hint').textContent=`נבחר ${P(sel).n}. לחץ על שחקן בקבוצה אחרת להחלפה, או על שם הקבוצה כדי להעביר אותו לשם.`;
  $('teams').innerHTML=S.teams.map((t,i)=>{
    const C=COL[i],pc=['d','m','a'].map(q=>[q,t.filter(id=>P(id).pos===q).length]).filter(x=>x[1]);
    return `<section class="team${from>=0&&from!==i?' target':''}" style="--tc:var(${C.c});--tk:${C.k}" data-t="${i}">
      <button class="team-h" data-h="${i}" aria-label="${C.n}, סכום ${tot(t).toFixed(1)}"><span class="tn">${C.n}</span><span class="ts"><b>${tot(t).toFixed(1)}</b><small>סכום</small></span></button>
      <div class="tmeta"><span>${t.length} שחקנים</span>${pc.map(([q,c])=>`<span class="pill">${POS[q]} ${c}</span>`).join('')}</div>
      <div>${t.slice().sort((a,b)=>P(b).r-P(a).r).map(id=>{const p=P(id);return `<button class="pr${sel===id?' sel':''}" data-p="${id}"><span class="n">${esc(p.n)}</span>${p.pos?`<span class="pos">${POS[p.pos]}</span>`:''}<span class="rt">${p.r.toFixed(1)}</span></button>`}).join('')}</div>
    </section>`}).join('');
  const v=S.rules.filter(r=>{const a=S.teams.findIndex(x=>x.includes(r.a)),b=S.teams.findIndex(x=>x.includes(r.b));return a>=0&&b>=0&&(r.k==='t'?a!==b:a===b)});
  $('viol').innerHTML=v.map(r=>`<p class="warn">⚠️ ${esc(P(r.a).n)} ו${esc(P(r.b).n)} ${r.k==='t'?'אמורים להיות באותה קבוצה':'לא אמורים להיות באותה קבוצה'}</p>`).join('');
}
$('teams').onclick=e=>{
  const h=e.target.closest('[data-h]'),b=e.target.closest('[data-p]');
  if(b){const id=+b.dataset.p,ti=S.teams.findIndex(t=>t.includes(id)),from=sel==null?-1:S.teams.findIndex(t=>t.includes(sel));
    if(sel==null||from===ti)sel=sel===id?null:id;
    else{S.teams[from][S.teams[from].indexOf(sel)]=id;S.teams[ti][S.teams[ti].indexOf(id)]=sel;toast(`${P(sel).n} ו${P(id).n} הוחלפו`);sel=null;save()}
  }else if(h&&sel!=null){const ti=+h.dataset.h,from=S.teams.findIndex(t=>t.includes(sel));
    if(from!==ti){S.teams[from]=S.teams[from].filter(x=>x!==sel);S.teams[ti].push(sel);toast(`${P(sel).n} עבר ל${COL[ti].n}`);save()}sel=null}
  renderTeams();renderDock();
};
$('back').onclick=()=>{mode='select';sel=null;render();scrollTo(0,0)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareText());toast('הקבוצות הועתקו')}catch(e){textSheet('העתקת הקבוצות','סמן את הטקסט והעתק אותו:',shareText())}};

/* ---------- dock ---------- */
function renderDock(){
  const D=$('dockIn');$('dock').hidden=tab!=='game';
  if(tab!=='game')return;
  if(mode==='select'){
    const n=S.present.length,k=n>14?3:2;
    D.innerHTML=`<button class="btn" id="go"${n<4?' disabled':''}>${n<4?'בחר לפחות 4 שחקנים':`חלק ל-${k} קבוצות <small>${n} שחקנים</small>`}</button>`;
    $('go').onclick=split;
  }else if(S.teams){
    D.innerHTML=`<div class="row2"><button class="btn ghost" id="again">חלק מחדש</button><a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText())}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.6-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.1-1.2l-.5-.3z"/></svg>שלח בוואטסאפ</a></div>`;
    $('again').onclick=()=>{split();toast('חלוקה חדשה')};
  }
}

/* ---------- players view ---------- */
function renderPlayers(){
  $('pc').textContent=S.players.length?`${S.players.length} שחקנים`:'רשימת השחקנים';
  const q=$('pq').value.trim();
  const L=S.players.filter(p=>!q||p.n.includes(q)).sort(sortBy==='r'?(a,b)=>b.r-a.r||byName(a,b):byName);
  $('plist').innerHTML=!S.players.length?`<p class="empty" style="padding:0 16px 16px">עוד אין שחקנים. לחץ על "שחקן חדש" כדי להתחיל.</p>`
    :!L.length?`<p class="empty" style="padding:0 16px 16px">לא נמצא שחקן בשם הזה.</p>`
    :L.map(p=>`<button class="pr" data-id="${p.id}"><span class="n">${esc(p.n)}</span>${p.pos?`<span class="pos">${POS[p.pos]}</span>`:''}<span class="rt">${p.r.toFixed(1)}</span><span class="chev" aria-hidden="true">‹</span></button>`).join('');
  $('rules').innerHTML=S.rules.length?S.rules.map((r,i)=>`<div class="rule"><span class="t"><b>${esc(P(r.a).n)}</b> ו<b>${esc(P(r.b).n)}</b></span><span class="tag ${r.k}">${r.k==='t'?'תמיד ביחד':'לא ביחד'}</span><button class="icon-x" data-i="${i}" aria-label="מחק כלל">✕</button></div>`).join('')
    :`<p class="empty">אין כללים כרגע.</p>`;
}
$('pq').oninput=renderPlayers;
$('sort').onclick=e=>{const b=e.target.closest('button');if(!b)return;sortBy=b.dataset.v;[...$('sort').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderPlayers()};
$('plist').onclick=e=>{const b=e.target.closest('[data-id]');if(b)editPlayer(+b.dataset.id)};
$('rules').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;S.rules.splice(+b.dataset.i,1);save();renderPlayers();toast('הכלל נמחק')};

/* ---------- sheet ---------- */
let sheetOpen=false;
function openSheet(html){
  $('sheet').innerHTML='<div class="grab"></div>'+html;
  if(!sheetOpen){$('ov').hidden=false;requestAnimationFrame(()=>$('ov').classList.add('open'));try{history.pushState({sheet:1},'')}catch(e){}}
  sheetOpen=true;
}
function closeSheet(fromPop){
  if(!sheetOpen)return;sheetOpen=false;$('ov').classList.remove('open');
  setTimeout(()=>{if(!sheetOpen){$('ov').hidden=true;$('sheet').innerHTML=''}},220);
  if(!fromPop)try{history.back()}catch(e){}
}
$('ov').onclick=e=>{if(e.target===$('ov'))closeSheet()};
addEventListener('popstate',()=>{if(sheetOpen)closeSheet(true)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function segInit(id,cb){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b));cb&&cb(b.dataset.v)}}
const segVal=id=>([...$(id).children].find(x=>x.getAttribute('aria-pressed')==='true')||{}).dataset.v;
function textSheet(title,sub,text){
  openSheet(`<h3>${title}</h3><p class="sub">${sub}</p><textarea rows="7" readonly id="tx">${esc(text)}</textarea><button class="btn" style="margin-top:12px" id="txok">סגור</button>`);
  setTimeout(()=>{$('tx').focus();$('tx').select()},250);$('txok').onclick=()=>closeSheet();
}

/* wheel 1.0 - 5.0 */
const wheelHTML=()=>`<div class="wheel"><div class="wl" id="wl">${Array.from({length:41},(_,i)=>`<div>${(1+i/10).toFixed(1)}</div>`).join('')}</div><div class="band"></div></div>`;
const wIdx=()=>Math.min(40,Math.max(0,Math.round($('wl').scrollTop/44)));
const wVal=()=>Math.round(10+wIdx())/10;
function wInit(v){
  const wl=$('wl'),mark=()=>{const k=wIdx();[...wl.children].forEach((d,i)=>d.classList.toggle('on',i===k))};
  wl.onscroll=mark;
  wl.onclick=e=>{const i=[...wl.children].indexOf(e.target);if(i>=0)wl.scrollTo({top:i*44,behavior:'smooth'})};
  const set=()=>{wl.scrollTop=Math.round((rate(v)-1)*10)*44;mark()};
  set();requestAnimationFrame(set);setTimeout(set,60);
}

/* player editor */
function editPlayer(id){
  const p=id?P(id):null;
  openSheet(`<h3>${p?'עריכת שחקן':'שחקן חדש'}</h3>
    <label class="fl">שם<input id="en" maxlength="20" autocomplete="off" enterkeyhint="done" value="${p?esc(p.n):''}"></label>
    <div class="fl">עמדה חזקה<div class="seg" id="ep">${[['','ללא'],['d','הגנה'],['m','אמצע'],['a','התקפה']].map(([k,v])=>`<button type="button" data-v="${k}" aria-pressed="${(p?p.pos:'')===k}">${v}</button>`).join('')}</div></div>
    <div class="fl">דירוג${wheelHTML()}</div>
    <p class="err" id="ee" hidden></p>
    ${p?`<button class="btn" id="es">שמור</button><button class="danger" id="ed">מחק את ${esc(p.n)}</button>`
       :`<div class="row2"><button class="btn ghost" id="em">הוסף ועוד אחד</button><button class="btn" id="es">הוסף</button></div>`}`);
  segInit('ep');wInit(p?p.r:3);
  if(!p)setTimeout(()=>$('en').focus(),250);
  const commit=more=>{
    const n=$('en').value.trim().replace(/\s+/g,' ');$('ee').hidden=true;
    const fail=m=>{$('ee').textContent=m;$('ee').hidden=false};
    if(!n)return fail('צריך לכתוב שם.');
    if(S.players.some(x=>x.n===n&&(!p||x.id!==p.id)))return fail('כבר יש שחקן בשם הזה.');
    const data={n,r:wVal(),pos:pos(segVal('ep'))};
    if(p){Object.assign(p,data);save();closeSheet();toast('השינויים נשמרו')}
    else{S.players.push({id:Date.now()+Math.floor(Math.random()*1000),...data});save();toast(`${n} נוסף`);
      if(more){$('en').value='';[...$('ep').children].forEach((x,i)=>x.setAttribute('aria-pressed',i===0));wInit(3);$('en').focus()}else closeSheet()}
    render();
  };
  $('es').onclick=()=>commit(false);
  if($('em'))$('em').onclick=()=>commit(true);
  $('en').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit(!p)}};
  if(p)$('ed').onclick=()=>{
    const b=$('ed');if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='לחץ שוב כדי למחוק לצמיתות';return}
    S.players=S.players.filter(x=>x.id!==p.id);S.present=S.present.filter(x=>x!==p.id);S.rules=S.rules.filter(r=>r.a!==p.id&&r.b!==p.id);
    if(S.teams){S.teams=S.teams.map(t=>t.filter(x=>x!==p.id));if(!S.teams.some(t=>t.length))S.teams=null}
    save();closeSheet();render();toast(`${p.n} נמחק`);
  };
}

/* rule editor with search */
function picker(n){
  const inp=$('pi'+n),box=$('ps'+n),out=$('pp'+n);
  const show=()=>{const q=inp.value.trim();const rk=p=>p.n===q?0:p.n.startsWith(q)?1:2;
    const m=q?S.players.filter(p=>p.n.includes(q)).sort((x,y)=>rk(x)-rk(y)||byName(x,y)).slice(0,8):[];
    box.innerHTML=q&&!m.length?'<p class="empty">לא נמצא שחקן.</p>':m.map(p=>`<button class="chip" type="button" data-id="${p.id}">${esc(p.n)}</button>`).join('')};
  inp.oninput=show;
  box.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;out.dataset.id=b.dataset.id;out.firstChild.textContent=P(+b.dataset.id).n;out.hidden=false;inp.hidden=true;box.innerHTML=''};
  out.querySelector('button').onclick=()=>{out.dataset.id='';out.hidden=true;inp.hidden=false;inp.value='';inp.focus()};
}
const pickerHTML=(n,ph)=>`<div class="pk"><input id="pi${n}" type="search" placeholder="${ph}" autocomplete="off"><div class="sug" id="ps${n}"></div><div class="picked" id="pp${n}" hidden><span></span><button type="button">החלף</button></div></div>`;
$('addRule').onclick=()=>{
  if(S.players.length<2){toast('צריך לפחות שני שחקנים ברשימה');return}
  openSheet(`<h3>כלל חדש</h3>
    <div class="fl">שחקן ראשון${pickerHTML(1,'הקלד שם')}</div>
    <div class="fl">מה הכלל?<div class="seg" id="rk"><button type="button" data-v="t" aria-pressed="true">תמיד ביחד</button><button type="button" data-v="n" aria-pressed="false">לא ביחד</button></div></div>
    <div class="fl">שחקן שני${pickerHTML(2,'הקלד שם')}</div>
    <p class="err" id="re" hidden></p>
    <button class="btn" id="rsave">הוסף כלל</button>`);
  picker(1);picker(2);segInit('rk');
  $('rsave').onclick=()=>{
    const a=+$('pp1').dataset.id,b=+$('pp2').dataset.id,k=segVal('rk'),fail=m=>{$('re').textContent=m;$('re').hidden=false};
    if(!a||!b)return fail('בחר שני שחקנים מההצעות שמופיעות בזמן ההקלדה.');
    if(a===b)return fail('בחר שני שחקנים שונים.');
    if(S.rules.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a)))return fail('כבר יש כלל לשני השחקנים האלה.');
    S.rules.push({a,b,k});save();closeSheet();renderPlayers();toast('הכלל נוסף');
  };
};

/* backup */
$('bk').onclick=async()=>{
  const t=JSON.stringify({players:S.players,rules:S.rules});
  try{await navigator.clipboard.writeText(t);toast('הגיבוי הועתק. הדבק אותו בהודעה לעצמך.')}
  catch(e){textSheet('העתקת גיבוי','סמן את כל הטקסט והעתק אותו:',t)}
};
$('rs').onclick=()=>{
  openSheet(`<h3>שחזור מגיבוי</h3><p class="sub">הדבק את טקסט הגיבוי. ${S.players.length?`הוא יחליף את הרשימה הנוכחית (${S.players.length} שחקנים).`:''}</p>
    <textarea rows="6" id="rt" placeholder="הדבק כאן"></textarea><p class="err" id="rerr" hidden style="margin-top:8px"></p>
    <button class="btn" id="rgo" style="margin-top:12px">שחזר</button>`);
  setTimeout(()=>$('rt').focus(),250);
  $('rgo').onclick=()=>{try{
    const x=JSON.parse($('rt').value);if(!Array.isArray(x.players))throw 0;
    const pl=x.players.filter(p=>p&&p.n!=null).map(p=>({id:+p.id,n:String(p.n),r:rate(p.r),pos:pos(p.pos)})),ids=pl.map(p=>p.id);
    S={players:pl,rules:(x.rules||[]).filter(r=>ids.includes(r.a)&&ids.includes(r.b)),present:[],teams:null};
    mode='select';save();closeSheet();render();toast(`שוחזרו ${pl.length} שחקנים`);
  }catch(e){$('rerr').textContent='הגיבוי לא תקין. הדבק את הטקסט המלא בדיוק כפי שהועתק.';$('rerr').hidden=false}};
};

/* new-player entry point in players view */
(()=>{const h=document.querySelector('#v-players .ch');const b=document.createElement('button');b.className='btn';b.style.cssText='width:auto;min-height:42px;font-size:16px';b.textContent='+ שחקן חדש';b.onclick=()=>editPlayer(null);h.appendChild(b)})();

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
